name: skansaba

services:
  # ------------------------------------------------------------------
  # Aplikasi Laravel (PHP-FPM + Nginx digabung dalam satu image)
  # ------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - WWWGROUP=${WWWGROUP:-1000}
        - WWWUSER=${WWWUSER:-1000}
    image: skansaba-app
    container_name: skansaba-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      WWWUSER: "${WWWUSER:-1000}"
      WWWGROUP: "${WWWGROUP:-1000}"
      # Aplikasi memakai MySQL container (bukan sqlite) di dalam Docker
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-skansaba}"
      DB_USERNAME: "${DB_USERNAME:-skansaba}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      # File upload user (SVG README, foto, dll) dipersist di host
      - storage-app-public:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ------------------------------------------------------------------
  # Database MySQL 8
  # ------------------------------------------------------------------
  db:
    image: mysql:8.4
    container_name: skansaba-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-skansaba}"
      MYSQL_USER: "${DB_USERNAME:-skansaba}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  db-data:
    name: skansaba-db-data
  storage-app-public:
    name: skansaba-storage
