name: skansaba

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: skansaba-app
    container_name: skansaba-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./storage/app/public:/var/www/html/storage/app/public
      - ./.env:/var/www/html/.env
